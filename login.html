<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Travel Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Travel Explorer</a>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="container auth">
      <div class="auth-card">
        <h2>Welcome back</h2>
        <form action="#">
          <label>Email<input type="email" placeholder="you@example.com" required /></label>
          <label>Password<input type="password" placeholder="Your password" required /></label>
          <button class="btn btn-block" type="submit">Login</button>
        </form>
        <p class="muted">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2025 Travel Explorer</p>
      </div>
    </footer>
  </body>
</html>
