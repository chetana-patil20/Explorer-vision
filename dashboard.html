<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — Travel Explorer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Travel Explorer</a>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
          <a href="login.html">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard">
      <aside class="sidebar">
        <h3>Your Account</h3>
        <nav class="side-nav">
          <a href="#">Profile</a>
          <a href="#">Bookings</a>
          <a href="#">Saved</a>
        </nav>
      </aside>

      <section class="dashboard-main">
        <h2>Welcome, Traveler</h2>
        <div class="grid">
          <div class="card small">
            <h4>Next Trip</h4>
            <p>No upcoming trips — start planning!</p>
          </div>
          <div class="card small">
            <h4>Saved</h4>
            <p>3 saved destinations</p>
          </div>
        </div>

        <h3>Recommended for you</h3>
        <div class="grid">
          <div class="card">
            <div class="card-image" style="background-image:url('https://images.unsplash.com/photo-1483683804023-6ccdb62f86ef?auto=format&fit=crop&w=1200&q=80')"></div>
            <div class="card-body"><h4>Lisbon</h4><p>Sunny streets and great food.</p></div>
          </div>
          <div class="card">
            <div class="card-image" style="background-image:url('https://images.unsplash.com/photo-1505765050526-6c8a5b9f6b5a?auto=format&fit=crop&w=1200&q=80')"></div>
            <div class="card-body"><h4>Maldives</h4><p>Relax on the water.</p></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2025 Travel Explorer</p>
      </div>
    </footer>
  </body>
</html>
