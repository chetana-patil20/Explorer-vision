<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div style="display: flex;">
        <!--logo-->
       <div>
        <img src="explorerlogo.png" alt="logo" height="100px" width="100px">
       </div>
        <!--company name-->
        <div style="padding-top: 30px; display: flex">
         <div>
            <span style="font-size: 32px; font-weight: bold; ">Travel Explorer</span>
         </div>
         <!--search bar-->
         <div>
            <form style="padding-left: 20px;padding-bottom: 20px;">
            <input type="text" placeholder="Search your destination" style="width: 300px; height: 30px; border-radius: 40px; border: 1px solid gray; padding-left: 10px;">
        </form>
         </div>

    </div>
    </div>
    </header>
    
</body>
</html>
